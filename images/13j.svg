<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 822.953125 450" style="max-width: 822.953px; background-color: transparent;" role="graphics-document document" aria-roledescription="pie"><defs>
      <linearGradient id="my-svg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#0042eb;stop-opacity:1"/>
        <stop offset="100%" style="stop-color:#eb0042;stop-opacity:1"/>
      </linearGradient>
    </defs><style>#my-svg{font-family:trebuchet ms,verdana,arial,sans-serif;font-size:16px;fill:#e0dfdf;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#a44141;}#my-svg .error-text{fill:#ddd;stroke:#ddd;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#cccccc;stroke:#cccccc;}#my-svg .marker.cross{stroke:#cccccc;}#my-svg svg{font-family:trebuchet ms,verdana,arial,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .pieCircle{stroke:#1f2024;stroke-width:2px;opacity:0.95;}#my-svg .pieOuterCircle{stroke:#1f2024;stroke-width:2px;fill:none;}#my-svg .pieTitleText{text-anchor:middle;font-size:25px;fill:#e0dfdf;font-family:trebuchet ms,verdana,arial,sans-serif;}#my-svg .slice{font-family:trebuchet ms,verdana,arial,sans-serif;fill:#e0dfdf;font-size:17px;}#my-svg .legend text{fill:#e0dfdf;font-family:trebuchet ms,verdana,arial,sans-serif;font-size:17px;}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g transform="translate(225,225)"><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,0,1,68.103,172.009L0,0Z" fill="#00d1ff" class="pieCircle"/><path d="M68.103,172.009A185,185,0,0,1,-162.117,89.124L0,0Z" fill="#7a5cff" class="pieCircle"/><path d="M-162.117,89.124A185,185,0,0,1,-149.668,-108.74L0,0Z" fill="#00e5a8" class="pieCircle"/><path d="M-149.668,-108.74A185,185,0,0,1,0,-185L0,0Z" fill="#ff5ea8" class="pieCircle"/><text transform="translate(136.29235603860556,-25.99915739876927)" class="slice" style="text-anchor: middle;">44%</text><text transform="translate(-46.9998864340342,130.5472066923988)" class="slice" style="text-anchor: middle;">23%</text><text transform="translate(-138.47620856942268,-8.712184584692166)" class="slice" style="text-anchor: middle;">18%</text><text transform="translate(-62.99118183886213,-123.62715523113603)" class="slice" style="text-anchor: middle;">15%</text><text x="0" y="-200" class="pieTitleText">"Example Failure Composition"</text><g class="legend" transform="translate(216,-44)"><rect width="18" height="18" style="fill: rgb(0, 209, 255); stroke: rgb(0, 209, 255);"/><text x="22" y="14">Context Blindness (no grounded context)</text></g><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill: rgb(122, 92, 255); stroke: rgb(122, 92, 255);"/><text x="22" y="14">Decision Gap (didn't search)</text></g><g class="legend" transform="translate(216,0)"><rect width="18" height="18" style="fill: rgb(0, 229, 168); stroke: rgb(0, 229, 168);"/><text x="22" y="14">Context Rot (window overflow)</text></g><g class="legend" transform="translate(216,22)"><rect width="18" height="18" style="fill: rgb(255, 94, 168); stroke: rgb(255, 94, 168);"/><text x="22" y="14">Hallucination (parametric error)</text></g></g></svg>